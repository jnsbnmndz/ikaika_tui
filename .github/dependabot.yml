# Opens the pull requests that keep the actions current; check-actions.ps1 is the half
# that notices when nobody merged one. Dependabot is not a workflow, so it needs no token
# to edit workflow files - the half that writes is the half with no credential. Grouped
# into one pull request, because three a week is how reviewing them becomes stamping them.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
    open-pull-requests-limit: 3
