# Builds, and on request tags and publishes. Every step calls script.ps1 rather than
# restating it in YAML, so there is one answer to what a release is and it can be
# rehearsed locally.
#
# `tag` is OFF by default, which makes a default run a rehearsal: the gate, a real signed
# build, a real installer kept as an artifact, and nothing pushed or published.
#
# Switches are chosen in YAML so they arrive as literal tokens - never built up in
# PowerShell and splatted. docs/pitfalls.md 7.1 is the release that died on it.

name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part of the version to raise. keep = a new build number, same version name'
        type: choice
        required: true
        default: patch
        options: [patch, minor, major, keep]
      released:
        description: 'Official release (adds -released, publishes as latest)'
        type: boolean
        required: true
        default: false
      sign:
        description: 'Sign the artifacts (needs the share link and the password secret)'
        type: boolean
        required: true
        default: true
      tag:
        description: 'Tag, push and publish. Off = rehearsal, nothing leaves the runner'
        type: boolean
        required: true
        default: false
      installer:
        description: 'Also wrap the frozen app in the NSIS installer'
        type: boolean
        required: true
        default: true
      clean:
        description: "Clear PyInstaller's cache and work directory before freezing"
        type: boolean
        required: true
        default: false
      python:
        description: 'CPython to freeze against (blank = the checkout venv)'
        type: string
        required: false
        default: ''
      optimize:
        description: 'Bytecode level: 1 drops asserts, 2 also drops docstrings'
        type: choice
        required: true
        default: '0'
        options: ['0', '1', '2']

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - name: Refuse an impossible combination
        if: ${{ inputs.tag && !inputs.installer }}
        shell: pwsh
        run: |
          Write-Host 'tag = true needs installer = true.' -ForegroundColor Red
          Write-Host 'The release is published with the installer as its only asset,' -ForegroundColor Yellow
          Write-Host 'and with installer = false there would not be one.' -ForegroundColor Yellow
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Identify the committer
        shell: pwsh
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Install NSIS
        if: ${{ inputs.installer }}
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'choco install nsis failed' }

      - name: Locate the caches
        id: caches
        shell: pwsh
        run: |
          $pip = ''
          try {
              $answer = & python -m pip cache dir 2>$null
              if ($LASTEXITCODE -eq 0) { $pip = "$answer".Trim() }
          } catch {
              $pip = ''
          }
          "pip=$pip" | Out-File $env:GITHUB_OUTPUT -Append

          $python = 'unknown'
          try {
              $answer = & python -c "import sys; sys.stdout.write('.'.join(map(str, sys.version_info[:3])))"
              if ($LASTEXITCODE -eq 0 -and $answer) { $python = "$answer".Trim() }
          } catch {
              $python = 'unknown'
          }
          "python=$python" | Out-File $env:GITHUB_OUTPUT -Append

          $pyinstaller = Join-Path $env:LOCALAPPDATA 'pyinstaller'
          "pyinstaller=$pyinstaller" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Cache the downloads
        if: ${{ steps.caches.outputs.pip != '' }}
        uses: actions/cache@v6
        with:
          path: ${{ steps.caches.outputs.pip }}
          key: pip-${{ runner.os }}-py${{ steps.caches.outputs.python }}-build-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-py${{ steps.caches.outputs.python }}-build-
            pip-${{ runner.os }}-py${{ steps.caches.outputs.python }}-

      - name: Cache the PyInstaller build cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.caches.outputs.pyinstaller }}
          key: pyinstaller-${{ runner.os }}-py${{ steps.caches.outputs.python }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            pyinstaller-${{ runner.os }}-py${{ steps.caches.outputs.python }}-

      - name: Set up the environment
        shell: pwsh
        run: .\script.ps1 setup-dev-env -Build -Lint

      - name: Check everything
        shell: pwsh
        run: .\script.ps1 check-all

      - name: Fetch the signing certificates
        if: ${{ inputs.sign }}
        shell: pwsh
        env:
          DTI_CERT_PASSWORD: ${{ secrets.DTI_CERT_PASSWORD }}
          DTI_CERT_SHARE_URL: ${{ secrets.DTI_CERT_SHARE_URL }}
          DTI_DEBUG_CERT_SHARE_URL: ${{ secrets.DTI_DEBUG_CERT_SHARE_URL }}
        run: |
          $needed = 'DTI_CERT_PASSWORD', 'DTI_CERT_SHARE_URL', 'DTI_DEBUG_CERT_SHARE_URL'
          $missing = @($needed | Where-Object { -not [Environment]::GetEnvironmentVariable($_) })
          if ($missing.Count) {
            Write-Host "Not set on this repository: $($missing -join ', ')" -ForegroundColor Red
            Write-Host 'Set them, or run this workflow with sign = false.' -ForegroundColor Yellow
            exit 1
          }
          .\script.ps1 setup-signing -FetchOnly -Yes

      - name: Bump the version and tag it
        id: bump
        shell: pwsh
        run: |
          .\script.ps1 bump-version -Bump ${{ inputs.bump }} -Yes ${{ inputs.released && '-Released' || '' }} ${{ !inputs.tag && '-WhatIf' || '' }}
          if ($LASTEXITCODE -ne 0) { throw 'bump-version failed' }

          . .\scripts\lib\app-version.ps1
          $version = Get-AppVersion
          $text = Format-AppVersion $version
          $tag = Get-TagName $version -Released:('${{ inputs.released }}' -eq 'true')
          "version=$text"   | Out-File $env:GITHUB_OUTPUT -Append
          "name=$($version.Name)" | Out-File $env:GITHUB_OUTPUT -Append
          "tag=$tag"        | Out-File $env:GITHUB_OUTPUT -Append

      - name: Build the app
        shell: pwsh
        run: |
          .\script.ps1 build-app ${{ inputs.released && '-Released' || '' }} ${{ inputs.sign && '-Sign' || '' }} ${{ inputs.clean && '-Clean' || '' }} -Optimize ${{ inputs.optimize }} ${{ inputs.python && format('-Python {0}', inputs.python) || '' }}
          if ($LASTEXITCODE -ne 0) { throw 'build-app failed' }

      - name: Record the benchmark in the README
        shell: pwsh
        run: |
          .\script.ps1 benchmark -NoBuild -Levels ${{ inputs.optimize }} -Runs 9 -UpdateReadme
          if ($LASTEXITCODE -ne 0) { throw 'benchmark failed' }
          if ('${{ inputs.tag }}' -eq 'true') {
            git add README.md
            git commit --amend --no-edit
            git tag -f '${{ steps.bump.outputs.tag }}'
          } else {
            Write-Host 'Rehearsal: README written, nothing committed.'
          }

      - name: Build the installer
        if: ${{ inputs.installer }}
        shell: pwsh
        run: |
          .\script.ps1 build-installer ${{ inputs.released && '-Released' || '' }} ${{ inputs.sign && '-Sign' || '' }}
          if ($LASTEXITCODE -ne 0) { throw 'build-installer failed' }

      - name: Push the commit and the tag
        if: ${{ inputs.tag }}
        shell: pwsh
        run: |
          git push origin HEAD "${{ steps.bump.outputs.tag }}"
          if ($LASTEXITCODE -ne 0) { throw 'the push failed' }

      - name: Publish the release
        if: ${{ inputs.tag }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.bump.outputs.tag }}'
          $text = '${{ steps.bump.outputs.version }}'
          $official = '${{ inputs.released }}' -eq 'true'
          $asset = Get-ChildItem 'dist' -Filter '*-setup*.exe' |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $asset) { throw 'no installer in dist to publish' }

          $signedNote = if ('${{ inputs.sign }}' -eq 'true') {
              'Signed with the ' + $(if ($official) { 'release' } else { 'debug' }) + ' certificate.'
          } else {
              'Unsigned - Windows will report an unknown publisher.'
          }

          $notes = @(
            "Version $text",
            '',
            $signedNote,
            'Per-user install under %LOCALAPPDATA%\Programs - no administrator prompt.',
            'Installing over an existing copy removes the old one first.'
          ) -join "`n"

          $generated = ''
          $answer = & gh api "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" `
              -f tag_name=$tag 2>$null
          if ($LASTEXITCODE -eq 0 -and $answer) {
              try { $generated = ($answer | ConvertFrom-Json).body } catch { $generated = '' }
          }
          if ($generated) {
              $notes = "$notes`n`n---`n`n$generated"
              Write-Host 'Release notes: generated changelog appended.'
          } else {
              Write-Host 'Release notes: nothing generated (first release, or the API declined).'
          }

          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $notes | Out-File $notesFile -Encoding utf8

          $releaseArgs = @('release', 'create', $tag, $asset.FullName,
                           '--title', "$text", '--notes-file', $notesFile)
          if (-not $official) { $releaseArgs += '--prerelease' }
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }

          Write-Host "Published $tag with $($asset.Name)"

          @(
            "## Published $tag",
            '',
            "| | |",
            "|---|---|",
            "| Version | ``$text`` |",
            "| Tag | [``$tag``]($env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/tag/$tag) |",
            "| Kind | $(if ($official) { 'official release' } else { 'prerelease (debug build)' }) |",
            "| Signed | $(if ('${{ inputs.sign }}' -eq 'true') { 'yes' } else { 'no' }) |",
            "| Installer | ``$($asset.Name)`` ($([math]::Round($asset.Length / 1MB, 1)) MB) |",
            "| Notes | $(if ($generated) { 'custom + generated changelog' } else { 'custom only' }) |"
          ) -join "`n" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Keep the build from a rehearsal
        if: ${{ !inputs.tag && inputs.installer }}
        uses: actions/upload-artifact@v7
        with:
          name: rehearsal-${{ steps.bump.outputs.version }}
          path: dist/*-setup*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Say what the rehearsal did
        if: ${{ always() && !inputs.tag }}
        shell: pwsh
        run: |
          $version = '${{ steps.bump.outputs.version }}'
          $tag = '${{ steps.bump.outputs.tag }}'
          @(
            '## Rehearsal - nothing was published',
            '',
            "| | |",
            "|---|---|",
            "| Version built | ``$(if ($version) { $version } else { 'the bump did not get that far' })`` |",
            "| Tag it would have cut | ``$(if ($tag) { $tag } else { '-' })`` |",
            "| Signed | $(if ('${{ inputs.sign }}' -eq 'true') { 'yes' } else { 'no' }) |",
            "| Installer | $(if ('${{ inputs.installer }}' -eq 'true') { 'built, kept as a run artifact for 14 days' } else { 'skipped' }) |",
            '',
            'Nothing was committed, tagged, pushed or published. Re-run with **tag** ticked to publish.'
          ) -join "`n" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
