# Weekly: fails when an action this repository uses is behind its latest release.
#
# The other half of dependabot.yml - one proposes the bump, this notices when nobody
# merged it. It runs scripts/check-actions.ps1 rather than a third-party action, because
# the third-party one was a Docker container action whose base image aged out and could
# not be patched from outside. docs/pitfalls.md 8.1.

name: actions-audit

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actions-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Check every action reference
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\script.ps1 check-actions
