[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "company-tui"
version = "0.0.0+1"
description = "Company developer toolbox for project scaffolding and automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["textual>=0.60"]

[project.scripts]
company = "company_tui.cli:main"

[tool.setuptools.packages.find]
include = ["company_tui*"]
