# Package metadata, the one dependency, and ruff's rule set.
#
# textual is FLOORED at the version this is tested on and CAPPED below the next major:
# the app uses register_theme, push_screen_wait and Strip/render_line internals, and
# internals move between majors (docs/pitfalls.md 5.2). Raise the cap after running the
# gate against the new major, not before.
#
# ruff is declared as a dev dependency so `uv sync` installs it instead of pruning it -
# docs/pitfalls.md 3.4 - and capped, because its defaults changed under this project once
# and turned a passing lint into 91 findings without a line of code changing. The rule
# selection is written out for the same reason: check-all treats a lint failure as FAIL,
# so what it enforces has to be a decision rather than whatever the installed ruff does.
#
# What the ignores are for:
#   E501    line length is the formatter's business; block art and tables are the point
#   FLY002  "use an f-string" - card art is written one line of the picture per line
#   RUF001/2  ambiguous unicode - the interface is DRAWN with box characters;
#             tests/test_glyphs.py is the real constraint, and it is a test not a lint
#   RUF012  ClassVar on BINDINGS/DEFAULT_CSS, which is how Textual declares them
#   S603    fires on every subprocess call; the house rule is already argument arrays
#           with shell=False, and S602 catches the spelling that is wrong
#   S608    "SQL injection" against a Textual DEFAULT_CSS block; there is no database
#
# S, BLE and RUF100 were turned on deliberately; the remaining style families
# (SIM, RET, RUF, PLW, DTZ, FURB) are adopted as their own change, with the findings read.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "company-tui"
version = "0.4.0+31"
description = "Company developer toolbox for project scaffolding and automation"
readme = "README.md"
requires-python = ">=3.11"

dependencies = ["textual>=8.2,<9"]

[project.scripts]
dti = "company_tui.cli:main"
company = "company_tui.cli:main"

[dependency-groups]
dev = ["ruff>=0.16.6,<0.17"]

[tool.setuptools.packages.find]
include = ["company_tui*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ISC", "S", "BLE", "RUF100"]

ignore = ["S603", "S608", "E501", "FLY002", "RUF001", "RUF002", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF059", "S101"]
